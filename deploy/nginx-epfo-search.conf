# nginx site for epfo-search (written by deploy/setup.sh).
# setup.sh fills in LISTEN_PORT, SERVER_NAME and APP_PORT. This block is
# never the default server, so other sites on this nginx are not affected.
server {
    listen LISTEN_PORT;
    server_name SERVER_NAME;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:APP_PORT;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # EPFO portal can be slow; details fetch many panels
        proxy_read_timeout 180s;
    }
}
